<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="PUNARVAAS — sub-village hazard zonation, carrying-capacity assessment of relocation sites, and immediate relocation needs for vulnerable habitations.">
<title>PUNARVAAS · relocation decision console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/src/styles/console.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7L4 23V9z' fill='%23c1272d'/%3E%3Cpath d='M16 9l6 3.5v7L16 23l-6-3.5v-7z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body data-theme="light">

<a class="skip" href="#rail">Skip to district navigation</a>

<header class="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 2l12 7v14l-12 7L4 23V9z" fill="currentColor"/>
      <path d="M16 9.2l5.9 3.4v6.8L16 22.8l-5.9-3.4v-6.8z" fill="var(--surface)"/>
    </svg>
    <div class="brandtext">
      <b>PUNARVAAS</b>
      <span>पुनर्वास · disaster relocation planning</span>
    </div>
  </div>

  <label class="field districtpick">
    <span class="sr">District</span>
    <select id="district" aria-label="Select district"></select>
  </label>

  <div id="snapshot" class="snapchip"
       title="Immutable snapshot · every number on screen is reproducible from this ID · the API is read-only and cannot change a published risk figure"
       aria-label="Snapshot ID">
    <svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true" style="margin-right:3px;opacity:.65;flex-shrink:0"><path d="M9 5V3.5a3 3 0 00-6 0V5H2v6h8V5H9zm-4.5 0V3.5a1.5 1.5 0 013 0V5h-3z" fill="currentColor"/></svg>
    <span class="snaplabel">Snapshot&#8202;</span>
  </div>

  <div class="spacer"></div>

  <label class="field search">
    <span class="sr">Search habitations or paste a cell id</span>
    <svg viewBox="0 0 16 16" class="ico" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 10l4 4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
    <input id="search" type="search" placeholder="Search habitation  ( / )" autocomplete="off" spellcheck="false">
  </label>

  <button id="theme" class="iconbtn" title="Switch light / dark" aria-label="Switch light or dark theme">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 100 13 5 5 0 010-13z" fill="currentColor"/></svg>
  </button>
  <button id="help" class="iconbtn" title="Keyboard shortcuts and how to read this" aria-label="Help">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.1 6a1.9 1.9 0 113.5 1c-.5.7-1.3.9-1.5 1.7v.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="12" r=".9" fill="currentColor"/></svg>
  </button>
  <a id="reportlink" class="btn" href="#" target="_blank" rel="noopener"
     title="Open the printable district report for review and approval">
    <span>District report</span>
    <svg viewBox="0 0 16 16" class="ico" aria-hidden="true"><path d="M6 3h7v7M13 3L4 12" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
  </a>
</header>

<div id="banner" class="banner" role="status" hidden></div>

<nav class="tabs" role="tablist" aria-label="Workspace">
  <button role="tab" id="tab-risk" data-tab="risk" aria-controls="stage" aria-selected="true"><b>1</b> Where is it unsafe</button>
  <button role="tab" id="tab-sites" data-tab="sites" aria-controls="stage" tabindex="-1" aria-selected="false"><b>2</b> Where can people go</button>
  <button role="tab" id="tab-plan" data-tab="plan" aria-controls="stage" tabindex="-1" aria-selected="false"><b>3</b> Who moves first</button>
  <button role="tab" id="tab-method" data-tab="method" aria-controls="stage" tabindex="-1" aria-selected="false"><b>4</b> Method &amp; provenance</button>
</nav>

<main id="app">
  <aside id="rail" class="rail" tabindex="-1" aria-label="District navigation"></aside>

  <!-- Below 1080px the rail and the panel become drawers. These are their handles;
       above that width the stylesheet hides them and both surfaces are always open. -->
  <button id="railbtn" class="drawerbtn left" aria-controls="rail" aria-expanded="false"
          title="Show the district summary and habitation list">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h8M2 12h12"
      stroke="currentColor" stroke-width="1.7" fill="none"/></svg>
    <em>District</em>
  </button>
  <button id="panelbtn" class="drawerbtn right" aria-controls="panel" aria-expanded="false"
          title="Show the details of the current selection">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h8M2 12h12"
      stroke="currentColor" stroke-width="1.7" fill="none"/></svg>
    <em>Details</em>
  </button>
  <button id="scrim" class="scrim" tabindex="-1" aria-label="Close panel"></button>

  <section id="stage" class="stage" role="tabpanel" aria-labelledby="tab-risk" tabindex="0">
    <div class="mapwrap">
      <div id="map" tabindex="0" role="region"
           aria-label="Interactive geographic risk map. Pan with arrow keys, zoom with plus or minus, or use the habitation list to inspect cells."></div>
      <div id="basemap-status" class="basemap-status card" role="status" hidden></div>
      <div id="tip" class="tip" hidden aria-hidden="true"></div>
      <div id="mapctl" class="mapctl"></div>
      <div id="legend" class="legend"></div>
      <div id="mapcontext" class="mapcontext card" hidden></div>
      <div id="scalebar" class="scalebar"><span></span><i></i></div>
      <div id="maploading" class="maploading" role="status" hidden><div class="spin"></div><p></p></div>
    </div>
    <div id="doc" class="doc" hidden></div>
  </section>

  <aside id="panel" class="panel" tabindex="-1" aria-live="polite" aria-label="Details"></aside>
</main>

<footer class="statusbar">
  <span id="statcount"></span>
  <span id="statcursor"></span>
  <span id="statzoom"></span>
  <span class="spacer"></span>
  <span id="statnote" class="muted"></span>
</footer>

<dialog id="helpdlg" class="helpdlg"></dialog>

<script type="module" src="/src/main.js"></script>
<noscript>
  <p style="padding:24px;font:16px/1.6 Georgia,serif">
    This console needs JavaScript. The same content, without any scripting, is at
    <code>/api/districts/&lt;district&gt;/report</code> — a full printable district report.
  </p>
</noscript>
</body>
</html>
