[project]
name = "punarvaas"
version = "0.9.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "numpy",
    "pandas",
    "PyYAML",
    "Jinja2",
    "libsql; sys_platform != 'win32'",
]

[project.optional-dependencies]
pipelines = ["pyarrow", "scipy", "shapely>=2.0,<3"]

[tool.vercel]
entrypoint = "app:app"
