name: punarvaas

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: pv_api
    environment:
      PV_STORE: sqlite
      PV_SQLITE: /app/data/punarvaas.db
    ports:
      - "8000:8000"
    volumes:
      - ./data/punarvaas.db:/app/data/punarvaas.db
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    restart: unless-stopped

  web:
    image: node:20-alpine
    container_name: pv_web
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "5173:5173"
    command:
      - sh
      - -c
      - npm install && npm run dev -- --host 0.0.0.0
    restart: unless-stopped

  gdal:
    image: ghcr.io/osgeo/gdal:ubuntu-small-3.9.3
    container_name: pv_gdal
    volumes:
      - .:/work
    working_dir: /work
    entrypoint:
      - /bin/bash
    profiles:
      - tools