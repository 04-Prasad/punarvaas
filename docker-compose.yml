name: punarvaas

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: pv_api

    environment:
      PV_STORE: sqlite
      PV_SQLITE: /app/data/punarvaas.db

    volumes:
      - ./data:/app/data

    expose:
      - "8000"

    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: pv_web

    ports:
      - "8081:80"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

  gdal:
    image: ghcr.io/osgeo/gdal:ubuntu-small-3.9.3
    container_name: pv_gdal

    volumes:
      - .:/work

    working_dir: /work

    entrypoint:
      - /bin/bash

    profiles:
      - tools
